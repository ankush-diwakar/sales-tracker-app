allprojects {
    buildscript {
        repositories {
            all { ArtifactRepository repo ->
                if (repo instanceof MavenArtifactRepository) {
                    def url = repo.url.toString()
                    if (url.contains('eas-build.internal') || url.contains('maven.production.caches')) {
                        remove repo
                    }
                }
            }
        }
    }
    repositories {
        all { ArtifactRepository repo ->
